  const DIMENSIONS=[
    {name:'稳定回应',low:'你允许关系保留弹性，更在意彼此的自我调节。',high:'你很看重可预期的回应与持续陪伴。'},
    {name:'直接沟通',low:'你倾向先消化情绪，再找合适时机表达。',high:'你倾向把感受及时说清楚，减少猜测。'},
    {name:'独立空间',low:'你偏爱密切分享日常，靠近会让你安心。',high:'你珍惜各自的时间与自主选择。'},
    {name:'探索新鲜',low:'熟悉的节奏和稳定的小仪式更能打动你。',high:'你容易被一起尝试新事物的热情点亮。'},
    {name:'共同担责',low:'你希望分工清楚，各自把负责的事做好。',high:'你更喜欢遇事一起商量、一起承担。'},
    {name:'主动表达',low:'你偏爱安静、细水长流的爱意。',high:'你乐于通过行动和语言主动表达喜欢。'}

  const Q=(dim,title,options)=>({dim,title,options:options.map(([text,w,v])=>({text,w,v}))});

    Q(0,'刚开始约会，对方临时改了周末计划，你最希望听到什么？',[
      ['解释原因并主动提出一个确定的新时间',[4,1,0],[88,75,35,30,65,65]],['一起看看各自安排，重新定一个都方便的时间',[1,4,0],[70,78,68,48,85,60]],['直接说“今晚换个新玩法”，把意外变成惊喜',[0,1,4],[48,67,60,90,57,85]],['先说明情况，再给我一点时间决定怎么调整',[1,2,1],[64,76,78,56,66,48]]]),
    Q(0,'消息迟迟没有回复时，哪种状态最让你安心？',[
      ['对方提前说忙，忙完会回来找我',[4,1,0],[90,72,47,32,55,62]],['我们有大致的联络习惯，不必每条都秒回',[1,4,0],[70,70,79,45,72,50]],['偶尔失联但回来会带着新鲜故事',[0,1,4],[42,60,80,86,50,76]],['我会先忙自己的事，必要时直接问清楚',[1,2,2],[56,91,90,60,74,55]]]),
    Q(0,'一段关系进入平淡期，什么会让你重新感到笃定？',[
      ['承诺过的小事依然稳定兑现',[4,1,0],[91,61,46,25,67,50]],['两人认真复盘最近的变化与需要',[0,4,1],[72,90,62,48,87,67]],['一起做一件以前没试过的事',[0,1,4],[46,61,60,95,59,82]],['各自有生活，也会主动给对方留位置',[1,3,1],[68,72,86,57,75,62]]]),
    Q(0,'你要独自去一个陌生城市，伴侣的哪种支持最贴心？',[

  function home(){return `<section class="hero card"><div class="hero-copy"><span class="eyebrow">✦ A LITTLE LOVE STUDY · VOL. 01</span><h1>你心动的，<br>从来不只是年龄。</h1><p class="hero-title-sub">💘 你的恋爱磁场</p><p class="hero-lead">有人让你安心，有人陪你疯，有人与你并肩。哪一种恋爱节奏更适合你？</p><div class="feature-row"><span class="feature"><b>✦</b> 24 道情境题</span><span class="feature"><b>✦</b> 约 5 分钟</span><span class="feature"><b>✦</b> 9 种细致画像</span></div><button class="btn btn-primary hero-cta" data-action="intro">开启我的心动探索 <span aria-hidden="true">↗</span></button><p class="micro">无需注册 · 答案仅在本机计算 · 免费查看完整报告</p></div><div class="hero-visual" aria-hidden="true"><div class="halo"></div><div class="orbit"></div><div class="hero-heart">♥</div><span class="spark s1">✦</span><span class="spark s2">✳</span><span class="spark s3">✧</span><span class="mini-pill p1">稳稳的安心感</span><span class="mini-pill p2">刚好的心动感</span></div></section><section class="below-hero" aria-label="测评特色"><div class="tiny-card"><div class="tiny-icon">🎞️</div><strong>从真实情境出发</strong><p>不是问你喜欢几岁，而是看你期待怎样的回应、节奏与相处。</p></div><div class="tiny-card"><div class="tiny-icon">🪞</div><strong>看见关系需求</strong><p>六个独立维度，帮你理解心动背后更具体的需要。</p></div><div class="tiny-card"><div class="tiny-icon">💌</div><strong>带走你的报告</strong><p>完整分析、竖版分享卡片与本地历史，由你决定是否保存。</p></div></section>`}
  function intro(){return `<section class="page"><div class="card page-card"><span class="eyebrow">BEFORE WE BEGIN / 测评说明</span><h2>先听听自己的真实感受。</h2><p>接下来的 24 道题，会带你走进联络、争执、独处、约会和共同决定等日常片段。每题选出此刻最贴近你的反应，没有标准答案。</p><div class="intro-grid"><div class="intro-tile"><div class="symbol">🕯️</div><strong>年上倾向</strong><p>可能更容易被稳妥回应、经验视角或安定的节奏吸引。</p></div><div class="intro-tile"><div class="symbol">🧩</div><strong>同龄倾向</strong><p>可能更偏爱平等协作、相互理解和并肩成长。</p></div><div class="intro-tile"><div class="symbol">🎠</div><strong>年下倾向</strong><p>可能更欣赏主动表达、活力与探索新事物的热情。</p></div></div><div class="note">这些只是关系偏好语言，不是对实际年龄或人格的判定。年上不天然成熟，年下不天然幼稚，同龄也不保证平等。</div><p>请根据你真实会喜欢的相处方式作答，不必选择看起来“更正确”的答案。你可以随时返回修改；只有主动点击保存，报告才会进入本地历史。</p><div class="actions"><button class="btn btn-primary" data-action="start">开始答题 · 24 题 →</button><button class="btn btn-outline" data-action="home">返回首页</button></div></div></section>`}
  const STAGES=['先从安心感开始','聊聊表达与误会','再看看靠近的距离','感受日常的节奏','一起面对现实选择','最后，听听心动的声音'];
  function quiz(){const q=QUESTIONS[state.index],answer=state.answers[state.index],pct=Math.round((state.index+1)/QUESTIONS.length*100);return `<section class="page"><div class="card page-card quiz-card"><div class="quiz-head"><div><span class="eyebrow">YOUR LOVE NOTES / 心动手记</span><p class="stage-note">${STAGES[q.dim]}</p></div><strong>第 ${state.index+1} / ${QUESTIONS.length} 题</strong></div><div class="progress-track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="24" aria-valuenow="${state.index+1}"><i style="width:${pct}%"></i></div><div class="q-dim">${String(q.dim+1).padStart(2,'0')} / ${DIMENSIONS[q.dim].name}</div><h2 class="q-title">${esc(q.title)}</h2><div class="options" role="group" aria-label="选择一个答案">${q.options.map((o,i)=>`<button class="option" data-answer="${i}" aria-pressed="${answer===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div class="quiz-footer"><button class="btn btn-outline" data-action="prev">${state.index===0?'返回说明':'← 上一题'}</button><button class="btn btn-primary" data-action="next" ${answer===null?'disabled':''}>${state.index===QUESTIONS.length-1?'查看我的报告 ✨':'下一题 →'}</button></div><p class="helper">选出第一反应即可；返回后，之前的答案仍会保留。</p></div></section>`}
  function calculate(answers){
    if(answers.length!==QUESTIONS.length||answers.some((a,i)=>!Number.isInteger(a)||a<0||a>=QUESTIONS[i].options.length))throw Error('请完成全部题目');
    const raw=[0,0,0],dimensionTotals=[0,0,0,0,0,0];
    answers.forEach((answer,i)=>{
      const option=QUESTIONS[i].options[answer];
      option.w.forEach((weight,j)=>raw[j]+=weight);
      // 每个维度的四道专属题贡献 75%，其他题的侧面线索贡献 25%。
      option.v.forEach((value,j)=>dimensionTotals[j]+=value*(j===QUESTIONS[i].dim?3:.2));
    });
    const total=raw.reduce((a,b)=>a+b,0);
    const exact=raw.map(value=>value/total*100);
    const scores=exact.map(Math.floor);
    // 最大余数法补足舍入误差，保证三个整数百分比恰好等于 100。
    const remainder=100-scores.reduce((a,b)=>a+b,0);
    exact.map((value,i)=>({i,fraction:value-scores[i]}))
      .sort((a,b)=>b.fraction-a.fraction||a.i-b.i)
      .slice(0,remainder).forEach(item=>scores[item.i]++);
    const dims=dimensionTotals.map(value=>Math.round(value/16));
    const rank=[0,1,2].sort((a,b)=>scores[b]-scores[a]||a-b);
    let type;
    if(scores[rank[0]]-scores[rank[1]]<=7){
      if((rank[0]===0&&rank[1]===2)||(rank[0]===2&&rank[1]===0))type='mix_poles';
      else if(dims[0]+dims[3]>=131)type='mix_balance';
      else type='mix_sync';
    }else if(rank[0]===0)type=dims[2]>=72?'older_side':'older_calm';
    else if(rank[0]===1)type=dims[3]>=66?'same_grow':'same_team';
    else type=dims[5]>=76&&dims[3]<84?'younger_bold':'younger_explore';
    return {id:Date.now()+Math.floor(Math.random()*1000),created:Date.now(),type,scores,dims,primary:rank[0],secondary:rank[1],feedback:null};
  }

  function scoresHtml(r){return `<section class="card section-card"><h2 class="section-title"><span class="num">01</span> 三种关系倾向</h2><p class="section-intro">这组比例是本次回答的偏好分布，不是与某个年龄段恋爱成功的概率。</p>${['年上','同龄','年下'].map((n,i)=>`<div class="score-row"><strong>${n}</strong><div class="bar" role="img" aria-label="${n}倾向 ${r.scores[i]}%"><i style="width:${r.scores[i]}%;background:${COLORS[i]}"></i></div><b>${r.scores[i]}%</b></div>`).join('')}<details class="disclaimer"><summary>这些分数怎样得出？</summary><p style="margin:10px 0 0">每个答案都有年上、同龄、年下三类偏好权重。24 题的权重分别相加，再换算为总和 100% 的整数比例；最高分与第二高分差距不超过 7 个百分点时，报告显示混合倾向。六项关系需求单独计算，各维度的四道专属题占 75%，其余题中的相关线索占 25%。</p></details><div class="disclaimer">年龄只是线索，不决定一个人的成熟度、责任感或相处质量。</div></section>`}

  function readingHtml(r){const t=REPORTS[r.type];return `<section class="card section-card"><h2 class="section-title"><span class="num">03</span> 关于你的心动方式</h2><div class="reading-grid"><div class="reading"><h3>💓 你的心动触发器</h3><p>${t.trigger}</p></div><div class="reading"><h3>🫶 理想的相处模式</h3><p>${t.ideal}</p></div><div class="reading"><h3>🧭 容易忽略的问题</h3><p>${t.risk}</p></div><div class="reading"><h3>💬 可以试试这样沟通</h3><p>${t.advice}</p></div></div></section><section class="card section-card"><h2 class="section-title"><span class="num">04</span> 把心动带回现实</h2><p class="section-intro">择偶时，观察行动比观察年龄标签更有帮助。</p><ul class="checklist"><li><i>✦</i><span>${t.observe}</span></li><li><i>✦</i><span>对方是否尊重你的“不”、愿意沟通分歧，并为自己的选择承担责任？</span></li><li><i>✦</i><span>你们的价值观、生活安排和边界能否在真实日常中协商？</span></li></ul><div class="disclaimer">年上不天然成熟，年下不天然幼稚，同龄也不保证平等。真实适配取决于尊重、沟通、价值观、责任感与边界意识。本测评仅供娱乐和自我探索。</div></section>`}

  function actionsHtml(r){const saved=state.history.some(x=>x.id===r.id);return `<section class="card section-card no-print"><h2 class="section-title"><span class="num">05</span> 把这份心动带走</h2><p class="section-intro">分享自己的感受，或留在本机，等以后再读。</p><div class="share-actions"><button class="btn btn-primary" data-action="share-card">生成分享卡片</button><button class="btn btn-soft" data-action="copy">复制结果摘要</button><button class="btn btn-outline" data-action="print">打印 / 保存 PDF</button><button class="btn btn-outline" data-action="save" ${saved?'disabled':''}>${saved?'已保存到本机':'保存到历史记录'}</button></div><p class="helper">只有点击“保存到历史记录”才会写入浏览器本地存储。清除浏览器数据也会移除记录。</p></section><section class="card section-card no-print"><h2 class="section-title"><span class="num">06</span> 你觉得准吗？</h2><div class="feedback">${['很符合','有一点像','不太符合'].map(x=>`<button class="btn btn-outline ${r.feedback===x?'chosen':''}" data-feedback="${x}" aria-pressed="${r.feedback===x}">${x}</button>`).join('')}</div><p class="helper">反馈仅保留在当前页面；若已保存报告，会同步更新这条本地记录。</p><h3 style="margin-top:29px">适合和朋友聊聊的 3 个问题</h3><div class="question-list">${DISCUSSIONS.map((x,i)=>`<div class="discussion">${i+1}. ${x}</div>`).join('')}</div><div class="actions" style="margin-top:24px"><button class="btn btn-soft" data-action="friend">发给朋友测测看 ↗</button><button class="btn btn-outline" data-action="restart">重新测评</button></div></section>`}

  function wrap(ctx,text,maxWidth){const words=[...text],lines=[];let line='';for(const ch of words){if(ctx.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines}

  function makeCard(){if(!state.result)return;const r=state.result,t=REPORTS[r.type],c=document.createElement('canvas');c.width=900;c.height=1200;const ctx=c.getContext('2d');if(!ctx){toast('当前浏览器不支持图片卡片，可使用文字分享。');return}const g=ctx.createLinearGradient(0,0,900,1200);g.addColorStop(0,'#fffdfb');g.addColorStop(.55,'#fff5f7');g.addColorStop(1,'#eee6f3');ctx.fillStyle=g;ctx.fillRect(0,0,900,1200);ctx.strokeStyle='#dfc7d1';ctx.lineWidth=2;ctx.strokeRect(36,36,828,1128);ctx.fillStyle='#efdce5';ctx.font='360px Georgia';ctx.fillText('♡',570,330);ctx.fillStyle='#9f4766';ctx.font='700 27px system-ui';ctx.fillText('💘 你的恋爱磁场',86,105);ctx.font='20px system-ui';ctx.fillText('YOUR LOVE MAGNET REPORT',86,145);ctx.fillStyle='#382832';ctx.font='100px system-ui';ctx.fillText(t.emoji,80,340);ctx.font='700 54px "Songti SC","SimSun",serif';let y=drawLines(ctx,t.title,86,425,730,75,2)+25;ctx.fillStyle='#9f4766';ctx.font='26px system-ui';ctx.fillText(t.kind+' · 心动关键词',86,y);y+=28;let tagX=86;t.keywords.forEach(k=>{ctx.font='23px system-ui';const w=ctx.measureText(k).width+42;ctx.fillStyle='#f6e5eb';roundRect(ctx,tagX,y,w,53,26);ctx.fillStyle='#814c63';ctx.fillText(k,tagX+21,y+35);tagX+=w+12});y+=95;ctx.fillStyle='#382832';ctx.font='700 26px system-ui';ctx.fillText('我的倾向分布',86,y);y+=45;['年上','同龄','年下'].forEach((n,i)=>{ctx.fillStyle='#554650';ctx.font='24px system-ui';ctx.fillText(n,86,y+23);ctx.fillStyle='#f1e4ea';roundRect(ctx,170,y,530,28,14);ctx.fillStyle=COLORS[i];roundRect(ctx,170,y,Math.max(10,530*r.scores[i]/100),28,14);ctx.fillStyle='#554650';ctx.font='700 24px system-ui';ctx.fillText(r.scores[i]+'%',720,y+23);y+=67});y+=25;ctx.fillStyle='#9f4766';ctx.font='700 29px "Songti SC","SimSun",serif';drawLines(ctx,'“'+t.quote+'”',86,y,725,49,3);ctx.fillStyle='#786a73';ctx.font='21px system-ui';ctx.fillText('分数代表本次回答的偏好分布 · 仅供娱乐与自我探索',86,1085);ctx.fillText('关系的适配，仍要看尊重、沟通与责任感。',86,1120);shareCanvas=c;const img=document.getElementById('share-preview');if(img)img.src=c.toDataURL('image/png')}
  async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed')}toast('已复制结果摘要')}catch{toast('复制未成功，请长按或选中文字手动复制。')}}
  function restart(){modal('开始新一轮测评？','当前答题状态会清空；已主动保存的历史报告仍可在历史记录查看。','重新开始',()=>{clearTimeout(revealTimer);state.answers=Array(QUESTIONS.length).fill(null);state.index=0;state.result=null;state.feedback=null;setScreen('intro')})}
  function showResult(){clearTimeout(revealTimer);setScreen('result')}
  app.addEventListener('click',async e=>{const answer=e.target.closest('[data-answer]');if(answer){state.answers[state.index]=Number(answer.dataset.answer);render();app.querySelector(`[data-answer="${answer.dataset.answer}"]`)?.focus();return}const version=e.target.closest('[data-version]');if(version){state.shareVersion=version.dataset.version;render();return}const feedback=e.target.closest('[data-feedback]');if(feedback&&state.result){state.result.feedback=feedback.dataset.feedback;const item=state.history.find(x=>x.id===state.result.id);if(item){item.feedback=state.result.feedback;persistHistory()}render();toast('谢谢你告诉我们你的感受。');return}const open=e.target.closest('[data-open-history]');if(open){const r=state.history.find(x=>x.id===Number(open.dataset.openHistory));if(r){state.result=r;state.returnTo='history';setScreen('result')}return}const del=e.target.closest('[data-delete-history]');if(del){const id=Number(del.dataset.deleteHistory);modal('删除这条记录？','这条本地报告删除后无法恢复。','删除记录',()=>{const previous=state.history;state.history=state.history.filter(x=>x.id!==id);if(persistHistory()){render();toast('记录已删除')}else state.history=previous});return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'home':setScreen('home');break;case'intro':setScreen('intro');break;case'start':state.answers=Array(QUESTIONS.length).fill(null);state.index=0;state.result=null;setScreen('quiz');break;case'prev':if(state.index===0)setScreen('intro');else{state.index--;render()}break;case'next':if(state.answers[state.index]===null){toast('请先选择一个答案。');break}if(state.index<QUESTIONS.length-1){state.index++;render();window.scrollTo({top:0,behavior:'smooth'})}else{try{state.result=calculate(state.answers);setScreen('reveal');revealTimer=setTimeout(showResult,750)}catch{toast('请完成全部题目。')}}break;case'show-result':showResult();break;case'result':setScreen('result');break;case'history':setScreen('history');break;case'share-card':state.shareVersion='short';setScreen('share');break;case'copy':if(state.result)await copyText(summary(state.result,state.shareVersion));break;case'print':window.print();break;case'save':if(state.result&&!state.history.some(x=>x.id===state.result.id)){const previous=state.history;state.history=[JSON.parse(JSON.stringify(state.result)),...state.history].slice(0,30);if(persistHistory()){render();toast('报告已保存到本机历史记录')}else state.history=previous}break;case'clear-history':modal('清除全部历史记录？','所有已保存的本地报告都会被删除，且无法恢复。','清除全部',()=>{const previous=state.history;try{localStorage.removeItem(STORAGE_KEY);state.history=[];toast('本地历史已清除');render()}catch{state.history=previous;toast('本地存储不可用，未能清除记录')}});break;case'restart':restart();break;case'download':if(!shareCanvas){toast('图片尚未生成，请使用文字分享。');break}try{const a=document.createElement('a');a.href=shareCanvas.toDataURL('image/png');a.download='我的恋爱磁场-'+state.result.type+'.png';document.body.appendChild(a);a.click();a.remove();toast('PNG 卡片已开始下载')}catch{toast('图片下载未成功，请长按预览图片尝试保存。')}break;case'share-image':if(!shareCanvas){toast('当前浏览器无法生成图片，请复制文字分享。');break}try{const blob=await new Promise(resolve=>shareCanvas.toBlob(resolve,'image/png'));if(!blob)throw Error('blob');const file=new File([blob],'我的恋爱磁场.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file],text:summary(state.result,'short')})}else toast('当前浏览器不支持直接分享图片，请下载 PNG 后发送。')}catch(err){if(err.name!=='AbortError')toast('分享未完成，可下载 PNG 或复制文字发送。')}break;case'friend':{try{const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#toast').textContent='';clone.querySelector('#modal-root').innerHTML='';const blob=new Blob(['<!doctype html>\n',clone.outerHTML],{type:'text/html;charset=utf-8'});const file=typeof File==='function'?new File([blob],'你的恋爱磁场.html',{type:'text/html'}):null;if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'你的恋爱磁场',text:'来测测你的恋爱磁场！'})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='你的恋爱磁场.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);toast('已下载测评 HTML 文件，发给朋友即可离线体验。')}}catch(err){if(err.name!=='AbortError')toast('分享未完成，请复制结果摘要或发送本地 HTML 文件。')}break}default:break}});
